<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micromark HTML Extension Test</title>
  </head>
  <body>
    <h1>Check Console for Output</h1>

    <script type="module">
      import { micromark } from 'https://esm.sh/micromark@4?bundle'
      import { fromMarkdown } from 'https://esm.sh/mdast-util-from-markdown@2?bundle'

      // Simplified Svelte element parser (from your code)
      function findBracketCore(str, pos, first = false) {
        if (str[pos] !== '{') return -1
        let i = pos + 1

        if (first) {
          const next = str[i]
          if (next === '#' || next === ':' || next === '/' || next === '@') {
            i++
          }
        }

        let depth = 1

        while (i < str.length && depth > 0) {
          const char = str[i]

          switch (char) {
            case '"':
            case "'":
            case '`':
              i = findStringEnd(str, i, char)
              if (i === -1) return -1
              i++
              continue

            case '/': {
              const next = str[i + 1]
              if (next === '/') {
                i = str.indexOf('\n', i + 2)
                if (i === -1) return -1
                i++
                continue
              }
              if (next === '*') {
                i = str.indexOf('*/', i + 2)
                if (i === -1) return -1
                i += 2
                continue
              }
              i = findRegexEnd(str, i)
              if (i === -1) return -1
              i++
              continue
            }

            case '{':
              depth++
              i++
              continue

            case '}':
              depth--
              if (depth === 0) return i
              i++
              continue

            default:
              i++
          }
        }

        return -1
      }

      function findStringEnd(str, pos, quote) {
        let i = pos + 1
        while (i < str.length) {
          const char = str[i]
          if (char === quote) return i
          if (char === '\\') {
            i += 2
            continue
          }
          if (quote === '`' && char === '$' && str[i + 1] === '{') {
            const closingBrace = findBracketCore(str, i + 1, false)
            if (closingBrace === -1) return -1
            i = closingBrace + 1
            continue
          }
          if (quote !== '`' && char === '\n') return -1
          i++
        }
        return -1
      }

      function findRegexEnd(str, pos) {
        let i = pos + 1
        while (i < str.length) {
          const char = str[i]
          if (char === '/') return i
          if (char === '\\') {
            i += 2
            continue
          }
          i++
        }
        return -1
      }

      // Micromark extension for HTML tags
      function htmlTagExtension() {
        return {
          flow: { 60: { tokenize: tokenizeHtmlTag } }, // 60 is '<'
          text: { 60: { tokenize: tokenizeHtmlTag } },
        }
      }

      function tokenizeHtmlTag(effects, ok, nok) {
        const self = this
        let buffer = ''

        return start

        function start(code) {
          if (code !== 60) return nok(code) // Not '<'
          effects.enter('htmlTag')
          effects.consume(code)
          buffer += String.fromCharCode(code)
          return afterOpen
        }

        function afterOpen(code) {
          if (code === null) return nok(code)

          // Handle closing tags
          if (code === 47) {
            // '/'
            effects.consume(code)
            buffer += String.fromCharCode(code)
            return insideTag
          }

          return insideTag(code)
        }

        function insideTag(code) {
          if (code === null) return nok(code)

          // Handle quotes
          if (code === 34 || code === 39) {
            // '"' or "'"
            const quote = code
            effects.consume(code)
            buffer += String.fromCharCode(code)
            return inQuote(quote)
          }

          // Handle JS brackets in attributes
          if (code === 123) {
            // '{'
            const startPos = buffer.length
            // Get the full remaining text to search
            const remaining = self.now()
            const fullText = buffer // We'll need to reconstruct this

            // For now, just consume character by character
            effects.consume(code)
            buffer += String.fromCharCode(code)
            return inBracket(1)
          }

          // Found closing >
          if (code === 62) {
            // '>'
            effects.consume(code)
            buffer += String.fromCharCode(code)
            effects.exit('htmlTag')
            return ok
          }

          // Regular character
          effects.consume(code)
          buffer += String.fromCharCode(code)
          return insideTag
        }

        function inQuote(quote) {
          return function (code) {
            if (code === null) return nok(code)

            // Handle brackets inside quotes
            if (code === 123) {
              // '{'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return inBracket(1, () => inQuote(quote))
            }

            // Handle escape
            if (code === 92) {
              // '\'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return afterEscape(() => inQuote(quote))
            }

            effects.consume(code)
            buffer += String.fromCharCode(code)

            // Closing quote
            if (code === quote) {
              return insideTag
            }

            return inQuote(quote)
          }
        }

        function inBracket(depth, returnTo = insideTag) {
          return function (code) {
            if (code === null) return nok(code)

            // Handle strings inside brackets
            if (code === 34 || code === 39 || code === 96) {
              // quotes or backtick
              const quote = code
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return inBracketString(quote, depth, returnTo)
            }

            // Handle comments
            if (code === 47) {
              // '/'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return afterSlash(depth, returnTo)
            }

            if (code === 123) {
              // '{'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return inBracket(depth + 1, returnTo)
            }

            if (code === 125) {
              // '}'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              if (depth === 1) {
                return returnTo
              }
              return inBracket(depth - 1, returnTo)
            }

            effects.consume(code)
            buffer += String.fromCharCode(code)
            return inBracket(depth, returnTo)
          }
        }

        function inBracketString(quote, depth, returnTo) {
          return function (code) {
            if (code === null) return nok(code)

            if (code === 92) {
              // '\'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return afterEscape(() => inBracketString(quote, depth, returnTo))
            }

            if (code === quote) {
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return inBracket(depth, returnTo)
            }

            effects.consume(code)
            buffer += String.fromCharCode(code)
            return inBracketString(quote, depth, returnTo)
          }
        }

        function afterSlash(depth, returnTo) {
          return function (code) {
            if (code === 47) {
              // '//' line comment
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return inLineComment(depth, returnTo)
            }

            if (code === 42) {
              // '/*' block comment
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return inBlockComment(depth, returnTo)
            }

            // Regex - simplified, just consume until '/'
            return inRegex(depth, returnTo)(code)
          }
        }

        function inLineComment(depth, returnTo) {
          return function (code) {
            if (code === null) return nok(code)
            effects.consume(code)
            buffer += String.fromCharCode(code)
            if (code === 10) {
              // '\n'
              return inBracket(depth, returnTo)
            }
            return inLineComment(depth, returnTo)
          }
        }

        function inBlockComment(depth, returnTo) {
          return function (code) {
            if (code === null) return nok(code)
            effects.consume(code)
            buffer += String.fromCharCode(code)
            if (code === 42) {
              // '*'
              return afterBlockCommentStar(depth, returnTo)
            }
            return inBlockComment(depth, returnTo)
          }
        }

        function afterBlockCommentStar(depth, returnTo) {
          return function (code) {
            if (code === 47) {
              // '/'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return inBracket(depth, returnTo)
            }
            return inBlockComment(depth, returnTo)(code)
          }
        }

        function inRegex(depth, returnTo) {
          return function (code) {
            if (code === null) return nok(code)

            if (code === 92) {
              // '\'
              effects.consume(code)
              buffer += String.fromCharCode(code)
              return afterEscape(() => inRegex(depth, returnTo))
            }

            effects.consume(code)
            buffer += String.fromCharCode(code)

            if (code === 47) {
              // '/'
              return inBracket(depth, returnTo)
            }

            return inRegex(depth, returnTo)
          }
        }

        function afterEscape(returnTo) {
          return function (code) {
            if (code === null) return nok(code)
            effects.consume(code)
            buffer += String.fromCharCode(code)
            return returnTo
          }
        }
      }

      // mdast extension
      function htmlTagFromMarkdown() {
        return {
          enter: {
            htmlTag(token) {
              this.enter(
                {
                  type: 'html',
                  value: this.sliceSerialize(token),
                },
                token,
              )
            },
          },
          exit: {
            htmlTag(token) {
              this.exit(token)
            },
          },
        }
      }

      // Test cases
      const tests = [
        '<div>',
        '</div>',
        '<div class="foo">',
        '<input type="text" />',
        '<svelte:element>',
        '<T.perspectiveCamera />',
        '<div onclick={handler}>',
        '<div class={true && "active"}>',
        '<div data-value={`template ${x}`}>',
        `<div onclick={() => { console.log("hi") }}>`,
        '<div>**bold**</div>',
        'text <span class={foo}>inline</span> more',
        '<div>\n\n**bold**\n\n</div>',
      ]

      console.log('=== Testing Micromark HTML Extension ===\n')

      import { unified } from 'https://esm.sh/unified@11?bundle'
      import stringToMdast from 'https://esm.sh/remark-parse@11?bundle'
      import mdastToHast from 'https://esm.sh/remark-rehype@11?bundle'
      import hastToString from 'https://esm.sh/rehype-stringify@10?bundle'

      function remarkHtmlTag() {
        const data = this.data()

        add('micromarkExtensions', htmlTagExtension())
        add('fromMarkdownExtensions', htmlTagFromMarkdown())

        function add(field, value) {
          const list = data[field] ? data[field] : (data[field] = [])
          list.push(value)
        }
      }

      for await (const test of tests) {
        console.count('Test')
        console.log('Input:', test)
        try {
          const pipe = unified()
            .use(stringToMdast)
            .use(remarkHtmlTag)
            .use(mdastToHast, { allowDangerousHtml: true })
            .use(hastToString, { allowDangerousHtml: true })

          const html = (await pipe.process(test)).toString()
          const mdast = pipe.parse(test)

          console.log('HTML output:', html)
          // console.log(mdast)
          console.log('Tree:', JSON.stringify(mdast, null, 2))
          console.log('---\n')
        } catch (err) {
          console.error('Error:', err.message)
        }
      }
    </script>
  </body>
</html>
