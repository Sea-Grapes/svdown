<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="output"></div>
  </body>
</html>

<script type="module">
  import { unified } from 'https://esm.sh/unified'
  import remarkParse from 'https://esm.sh/remark-parse'
  import remarkRehype from 'https://esm.sh/remark-rehype'
  import rehypeStringify from 'https://esm.sh/rehype-stringify'

  import { codes, constants } from 'https://esm.sh/micromark-util-symbol'
  import {
    markdownLineEnding,
    markdownSpace,
  } from 'https://esm.sh/micromark-util-character'

  function htmlWithMarkdown() {
    return {
      text: {
        // Add as array with your construct first (higher priority)
        [codes.lessThan]: [htmlTextConstruct],
      },
    }
  }

  const htmlTextConstruct = {
    name: 'htmlTextElement',
    tokenize: tokenizeHtmlText,
    // Add resolveAll to intercept HTML tokens
    resolveAll: createResolver(),
  }

  function createResolver() {
    return function resolveAll(events, context) {
      // Remove any built-in HTML events
      return events.filter((event) => {
        return event[1].type !== 'htmlText'
      })
    }
  }

  function tokenizeHtmlText(effects, ok, nok) {
    let tagName = ''

    return start

    function start(code) {
      if (code !== codes.lessThan) return nok(code)

      effects.enter('htmlTextElement')
      effects.enter('htmlTextTag')
      effects.consume(code) // <
      return tagOpen
    }

    function tagOpen(code) {
      if (code === codes.slash) {
        return nok(code)
      }

      if (isNameStart(code)) {
        effects.enter('htmlTextTagName')
        tagName += String.fromCharCode(code)
        effects.consume(code)
        return tagNameChar
      }

      return nok(code)
    }

    function tagNameChar(code) {
      if (isNameChar(code)) {
        tagName += String.fromCharCode(code)
        effects.consume(code)
        return tagNameChar
      }

      effects.exit('htmlTextTagName')

      if (code === codes.greaterThan) {
        return tagEnd(code)
      }

      if (markdownSpace(code)) {
        return skipSpaces(code)
      }

      return nok(code)
    }

    function skipSpaces(code) {
      if (markdownSpace(code)) {
        effects.consume(code)
        return skipSpaces
      }

      if (code === codes.greaterThan) {
        return tagEnd(code)
      }

      return consumeUntilClose(code)
    }

    function consumeUntilClose(code) {
      if (code === codes.greaterThan) {
        return tagEnd(code)
      }

      if (code === codes.eof || markdownLineEnding(code)) {
        return nok(code)
      }

      effects.consume(code)
      return consumeUntilClose
    }

    function tagEnd(code) {
      effects.consume(code) // >
      effects.exit('htmlTextTag')
      return contentText
    }

    function contentText(code) {
      if (code === codes.lessThan) {
        return effects.check(
          closingTag(tagName),
          afterClosingTag,
          continueContent,
        )(code)
      }

      if (markdownLineEnding(code) || code === codes.eof) {
        return nok(code)
      }

      return ok(code)
    }

    function continueContent(code) {
      return ok(code)
    }

    function afterClosingTag(code) {
      effects.exit('htmlTextElement')
      return ok(code)
    }
  }

  function closingTag(expectedName) {
    return {
      tokenize: tokenizeClosingTag,
      partial: true,
    }

    function tokenizeClosingTag(effects, ok, nok) {
      let actualName = ''

      return start

      function start(code) {
        if (code !== codes.lessThan) return nok(code)

        effects.enter('htmlClosingTag')
        effects.consume(code)
        return slash
      }

      function slash(code) {
        if (code !== codes.slash) return nok(code)
        effects.consume(code)
        return nameStart
      }

      function nameStart(code) {
        if (!isNameStart(code)) return nok(code)
        actualName += String.fromCharCode(code)
        effects.consume(code)
        return nameChar
      }

      function nameChar(code) {
        if (isNameChar(code)) {
          actualName += String.fromCharCode(code)
          effects.consume(code)
          return nameChar
        }

        if (actualName !== expectedName) {
          return nok(code)
        }

        if (markdownSpace(code)) {
          effects.consume(code)
          return afterName
        }

        if (code === codes.greaterThan) {
          effects.consume(code)
          effects.exit('htmlClosingTag')
          return ok
        }

        return nok(code)
      }

      function afterName(code) {
        if (markdownSpace(code)) {
          effects.consume(code)
          return afterName
        }

        if (code === codes.greaterThan) {
          effects.consume(code)
          effects.exit('htmlClosingTag')
          return ok
        }

        return nok(code)
      }
    }
  }

  function isNameStart(code) {
    return (
      (code >= codes.uppercaseA && code <= codes.uppercaseZ) ||
      (code >= codes.lowercaseA && code <= codes.lowercaseZ)
    )
  }

  function isNameChar(code) {
    return (
      isNameStart(code) ||
      (code >= codes.digit0 && code <= codes.digit9) ||
      code === codes.dash ||
      code === codes.colon
    )
  }

  function remarkHtmlMarkdown() {
    const data = this.data()

    // CRITICAL: Disable built-in HTML
    add('micromarkExtensions', {
      disable: { null: ['htmlText', 'htmlFlow'] },
    })

    add('micromarkExtensions', htmlWithMarkdown())
    add('fromMarkdownExtensions', fromMarkdown())

    function add(field, value) {
      const list = data[field] ? data[field] : (data[field] = [])
      list.push(value)
    }
  }

  function fromMarkdown() {
    return {
      enter: {
        htmlTextElement: enterHtmlTextElement,
      },
      exit: {
        htmlTextElement: exitHtmlElement,
        htmlTextTagName: exitTagName,
      },
    }

    function enterHtmlTextElement(token) {
      this.enter(
        {
          type: 'htmlTextElement',
          name: null,
          children: [],
        },
        token,
      )
    }

    function exitTagName(token) {
      const node = this.stack[this.stack.length - 1]
      node.name = this.sliceSerialize(token)
    }

    function exitHtmlElement(token) {
      this.exit(token)
    }
  }

  const processor = unified()
    .use(remarkParse)
    .use(remarkHtmlMarkdown)
    .use(remarkRehype, {
      handlers: {
        htmlTextElement: (h, node) => {
          return h(node, node.name, node.children)
        },
      },
    })
    .use(rehypeStringify)

  try {
    const result = await processor.process('<div>**test**</div>')
    console.log('Result:', String(result))
    document.getElementById('output').innerHTML = `
      <pre>Result: ${String(result)}</pre>
    `
  } catch (e) {
    console.error(e)
    document.getElementById('output').innerHTML =
      `<pre>Error: ${e.message}</pre>`
  }
</script>
