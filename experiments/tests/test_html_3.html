<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="output"></div>
  </body>
</html>

<script type="module">
  import { unified } from 'https://esm.sh/unified'
  import remarkParse from 'https://esm.sh/remark-parse'
  import remarkRehype from 'https://esm.sh/remark-rehype'
  import rehypeStringify from 'https://esm.sh/rehype-stringify'

  import { codes } from 'https://esm.sh/micromark-util-symbol'
  import {
    markdownLineEnding,
    markdownSpace,
  } from 'https://esm.sh/micromark-util-character'

  const ch = str => str.charCodeAt(0)

  function micromark() {
    return {
      flow: {
        [ch('<')]: {
          tokenize,
          concrete: true
        }
      }
    }
  }

  function tokenize(effects, ok, nok) {
    const self = this

    return start

    function start(code) {
      effects.enter('svelteFlow')
    }
  }

  function remarkSvelte() {
    const data = this.data()
    add('micromarkExtensions', {
      disable: { null: ['htmlText', 'htmlFlow'] },
    })
    add('micromarkExtensions', micromark())

    function add(field, value) {
      const list = data[field] ? data[field] : (data[field] = [])
      list.push(value)
    }
  }

  const processor = unified()
    .use(remarkParse)
    .use(remarkSvelte)
    .use(remarkRehype, {
      handlers: {
        svelteHtml: (state, node) => {
          // state.all() processes the children
          const children = state.all(node)
          // Return a hast element node
          return {
            type: 'element',
            tagName: node.name,
            properties: {},
            children: children,
          }
        },
      },
    })
    .use(rehypeStringify)

  try {
    const result = await processor.process('<div>**test**</div>')
    console.log('Result:', String(result))

    // Show both the HTML output and render it
    document.getElementById('output').innerHTML = `
      <div style="margin-bottom: 20px;">
        <h3>HTML Output:</h3>
        <pre style="background: #f0f0f0; padding: 10px;">${escapeHtml(String(result))}</pre>
      </div>
      <div>
        <h3>Rendered:</h3>
        <div style="border: 1px solid #ccc; padding: 10px;">
          ${String(result)}
        </div>
      </div>
    `
  } catch (e) {
    console.error(e)
    document.getElementById('output').innerHTML = `
      <div style="color: red;">
        <h3>Error:</h3>
        <pre style="background: #fee; padding: 10px;">${escapeHtml(e.message)}\n\n${escapeHtml(e.stack)}</pre>
      </div>
    `
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;')
  }
</script>
