  import string_to_mdast from 'https://esm.sh/remark-parse'

  import { walk } from 'https://esm.sh/zimmerframe@1.1.4'

  // Step 1: Blank out ranges before Svelte parse.
  // (Svelte can't parse code blocks, inline code, custom nodes, etc.)
  function blankMarkdownProtectedRanges(mdast, text) {
    const ranges = []

    const SVELTE_SAFE_NODE_TYPES = new Set([
      'root',
      'paragraph',
      'heading',
      'blockquote',
      'list',
      'listItem',
      'emphasis',
      'strong',
      'delete', // strikethrough
      'link',
      'text', // should we restrict text to certain parents? maybe paragraph/other safe nodes
      'break',
      'thematicBreak',
      // html nodes are already raw, Svelte handles them fine
      'html',
    ])

    visit(mdast, (node) => {
      // console.log(node.type)
      if (!SVELTE_SAFE_NODE_TYPES.has(node.type)) {
        ranges.push({
          start: node.position.start.offset,
          end: node.position.end.offset,
        })
        node.privateMarkdownRange = true
        return SKIP
      }
    })

    // Todo: improve and test performance. This just replaces the ranges with spaces.
    const chars = text.split('')
    for (const { start, end } of ranges) {
      for (let i = start; i < end; i++) {
        if (chars[i] != '\n') chars[i] = ' '
      }
    }
    return chars.join('')
  }

  // Step 2: Parse svelte (which works now)
  // @todo add handling if svparse fails
  function blankSvelteProtectedRanges(text) {
    const svast = svparse(text, { modern: true })
    console.log('svast', svast)

    let result = ''

    const push_text = (text) => (result += text)
    const push_inline = () => (result += '\uE000') //result.push({ type: 'inline' })
    const push_block = () => (result += '\uE001') //result.push({ type: 'block' })

    const INLINE_TYPES = new Set([
      'ExpressionTag',
      'HtmlTag',
      'ConstTag',
      'DeclarationTag',
      'DebugTag',
      'RenderTag',
      'AttachTag',
      'Comment',
    ])

    const BLOCK_TYPES = new Set([
      'Component',
      'TitleElement',
      'SlotElement',
      'RegularElement',
      'SvelteBody',
      'SvelteBoundary',
      'SvelteComponent',
      'SvelteDocument',
      'SvelteElement',
      'SvelteFragment',
      'SvelteHead',
      'SvelteSelf',
      'SvelteWindow',
      'EachBlock',
      'IfBlock',
      'AwaitBlock',
      'KeyBlock',
      'SnippetBlock',
    ])

    function get_fragments(node) {
      switch (node.type) {
        case 'EachBlock':
          return [node.body, node.fallback].filter(Boolean)
        case 'IfBlock':
          return [node.consequent, node.alternate].filter(Boolean)
        case 'AwaitBlock':
          return [node.pending, node.then, node.catch].filter(Boolean)
        case 'KeyBlock':
          return [node.fragment]
        case 'SnippetBlock':
          return [node.body]
        default:
          return node.fragment ? [node.fragment] : []
      }
    }

    function handle_fragment(fragment) {
      for (const node of fragment.nodes) {
        handle_node(node)
      }
    }

    function handle_node(node) {
      if (node.type === 'Text') {
        return push_text(node.raw)
      } else if (INLINE_TYPES.has(node.type)) {
        return push_inline()
      } else if (BLOCK_TYPES.has(node.type)) {
        push_block()
        for (const fragment of get_fragments(node)) {
          handle_fragment(fragment)
        }
        push_block()
        return
      } else {
        console.warn(`unhandled node type: ${node.type}`)
        push_block()
      }
    }
  }

  async function parse(text, config) {
    const pipeline = unified()
      .use(string_to_mdast) // make sure to add plugins later!
      .use(mdast_to_hast)
      .use(hast_to_string)

    const mdast = pipeline.parse(text) // this only calls the mdast parsing
    console.log('raw text -> mdast', mdast)

    const sanitized = blankMarkdownProtectedRanges(mdast, text)
    console.log('sanitized text', sanitized)

    const test = blankSvelteProtectedRanges(sanitized)
    // console.log(final_mdast)
  }
