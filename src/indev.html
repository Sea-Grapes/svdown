  import string_to_mdast from 'https://esm.sh/remark-parse'
  import mdast_to_hast from 'https://esm.sh/remark-rehype'
  import hast_to_string from 'https://esm.sh/rehype-stringify'
  import { unified } from 'https://esm.sh/unified'
  import { inspect } from 'https://esm.sh/unist-util-inspect'
  import { CONTINUE, EXIT, SKIP, visit } from 'https://esm.sh/unist-util-visit'
  import { parse as svparse } from 'https://esm.sh/svelte@5.56.3/compiler'
  import { walk } from 'https://esm.sh/zimmerframe@1.1.4'

  // Step 1: Blank out ranges before Svelte parse.
  // (Svelte can't parse code blocks, inline code, custom nodes, etc.)
  function hide_markdown_ranges(mdast, text) {
    const ranges = []

    const SVELTE_SAFE_NODE_TYPES = new Set([
      'root',
      'paragraph',
      'heading',
      'blockquote',
      'list',
      'listItem',
      'emphasis',
      'strong',
      'delete', // strikethrough
      'link',
      'text', // should we restrict text to certain parents? maybe paragraph/other safe nodes
      'break',
      'thematicBreak',
      // html nodes are already raw, Svelte handles them fine
      'html',
    ])

    visit(mdast, (node) => {
      // console.log(node.type)
      if (!SVELTE_SAFE_NODE_TYPES.has(node.type)) {
        ranges.push({
          start: node.position.start.offset,
          end: node.position.end.offset,
        })
        node.privateMarkdownRange = true
        return SKIP
      }
    })

    // Todo: improve and test performance. This just replaces the ranges with spaces.
    const chars = text.split('')
    for (const { start, end } of ranges) {
      for (let i = start; i < end; i++) {
        if (chars[i] != '\n') chars[i] = ' '
      }
    }
    return chars.join('')
  }

  // Step 2: Parse svelte (which works now)
  // @todo add handling if svparse fails
  function hide_svelte_ranges(text, raw) {
    const svast = svparse(text, { modern: true })
    console.log('svast', svast)
    const output = []
    let i = 0

    function flush_block(end) {
      if (end > i) {
        const start = i
        output.push({ type: 'block', start, end, value: raw.slice(start, end) })
      }
    }

    const INLINE_TYPES = new Set([
      'ExpressionTag',
      'HtmlTag',
      'ConstTag',
      'DeclarationTag',
      'DebugTag',
      'RenderTag',
      'AttachTag',
      'Comment',
    ])

    function get_fragments(node) {
      switch (node.type) {
        case 'EachBlock':
          return [node.body, node.fallback].filter(Boolean)
        case 'IfBlock':
          return [node.consequent, node.alternate].filter(Boolean)
        case 'AwaitBlock':
          return [node.pending, node.then, node.catch].filter(Boolean)
        case 'KeyBlock':
          return [node.fragment]
        case 'SnippetBlock':
          return [node.body]
        default:
          return node.fragment ? [node.fragment] : []
      }
    }

    function handle_fragment(fragment) {
      for (const node of fragment.nodes) handle_node(node)
    }

    function emit(type, node) {}

    // Uses inline/text nodes as reference
    // Flushes previous block region if any
    function handle_node(node) {
      if (node.type === 'Text') {
        flush_block(node.start)
        output.push({
          type: 'text',
          start: node.start,
          end: node.end,
          value: raw.slice(node.start, node.end),
        })
        i = node.end
        return
      } else if (INLINE_TYPES.has(node.type)) {
        flush_block(node.start)
        output.push({
          type: 'inline',
          start: node.start,
          end: node.end,
          value: raw.slice(node.start, node.end),
        })
        i = node.end
        return
      } else {
        for (const fragment of get_fragments(node)) handle_fragment(fragment)
      }
    }

    handle_fragment(svast.fragment)
    flush_block(raw.length)

    return output
  }

  async function parse(raw, config) {
    const pipeline = unified()
      .use(string_to_mdast) // make sure to add plugins later!
      .use(remark_svelte_placeholders)
      .use(mdast_to_hast)
      .use(hast_to_string)

    const mdast = pipeline.parse(raw) // this only calls the mdast parsing
    console.log('raw text -> mdast', mdast)

    const sanitized = hide_markdown_ranges(mdast, raw)
    console.log('sanitized text', sanitized)

    const final = hide_svelte_ranges(sanitized, raw)
    console.log(final)
  }
