  import string_to_mdast from 'https://esm.sh/remark-parse'
  import mdast_to_hast from 'https://esm.sh/remark-rehype'
  import hast_to_string from 'https://esm.sh/rehype-stringify'
  import { unified } from 'https://esm.sh/unified'
  import { inspect } from 'https://esm.sh/unist-util-inspect'
  import { CONTINUE, EXIT, SKIP, visit } from 'https://esm.sh/unist-util-visit'
  import { parse as svparse } from 'https://esm.sh/svelte@5.56.3/compiler'
  import { walk } from 'https://esm.sh/zimmerframe@1.1.4'

  // Step 1: Blank out ranges before Svelte parse.
  // (Svelte can't parse code blocks, inline code, custom nodes, etc.)
  function hide_markdown_ranges(mdast, text) {
    const ranges = []

    const SVELTE_SAFE_NODE_TYPES = new Set([
      'root',
      'paragraph',
      'heading',
      'blockquote',
      'list',
      'listItem',
      'emphasis',
      'strong',
      'delete', // strikethrough
      'link',
      'text', // should we restrict text to certain parents? maybe paragraph/other safe nodes
      'break',
      'thematicBreak',
      // html nodes are already raw, Svelte handles them fine
      'html',
    ])

    visit(mdast, (node) => {
      // console.log(node.type)
      if (!SVELTE_SAFE_NODE_TYPES.has(node.type)) {
        ranges.push({
          start: node.position.start.offset,
          end: node.position.end.offset,
        })
        node.privateMarkdownRange = true
        return SKIP
      }
    })

    // Todo: improve and test performance. This just replaces the ranges with spaces.
    const chars = text.split('')
    for (const { start, end } of ranges) {
      for (let i = start; i < end; i++) {
        if (chars[i] != '\n') chars[i] = ' '
      }
    }
    return chars.join('')
  }

  // Step 2: Parse svelte (which works now)
  // @todo add handling if svparse fails
  function hide_svelte_ranges(text, raw, mdast_root) {
    const svast = svparse(text, { modern: true })
    console.log('svast', svast)

    function slice_mdast(node_list, slice_start, slice_end) {
      const result = []

      // Error: this does not work because not all text value is contained in the mdast. Ideally then we want to operate on leaf nodes primarily?
      // (Issue I encountered is end of html element, the > button thing; it turns into blockquote at position 140
      // but the text is at 142, and svast reads it at 141, thus the blockquote node is invalid)
      // Maybe first we should try just reparsing the markdown oh but then the issue is full text markdown doesnt work hmm.
      for (const node of node_list) {
        // case 1: our node is starting before the slice start. Immediately discard it.
        if (node.position.start.offset < slice_start) {
          continue
        }
        // now we are within the slice start.
        // case 2: node end is within the slice, so add it.
        else if (node.position.end.offset <= slice_end) {
          result.push(node)
          // TODO: Remove node from mdast for performance boost
        }
        // case 3: if we overshot. Not sure if necessary but my brain tells me its necessary later.
        else if (node.position.start.offset >= slice_end) {
          break
        }
        // final case: start is within bounds, but end is after. Needs recursion.
        else {
          if (node.children) {
            // I think I can just reassign this because svast structure never has two adjacent text nodes. It alternates
            node.children = slice_mdast(node.children, slice_start, slice_end)
            result.push(node)
          } else if (node.value) {
            result.push(node)
            // we'll figure that out next time
          }
        }
      }

      return result
    }

    // temporary for testing
    let text_nodes = []

    walk(
      svast,
      {},
      {
        Text(node, { next }) {
          // console.log(node)
          text_nodes.push(node)
          next()
        },
      },
    )

    for (const node of text_nodes) {
      let test2 = slice_mdast(mdast_root.children, node.start, node.end)
      console.log('tried slice', node, test2)
    }

    return svast
  }

  async function parse(raw, config) {
    const pipeline = unified()
      .use(string_to_mdast) // make sure to add plugins later!
      .use(mdast_to_hast, { allowDangerousHtml: true })
      .use(hast_to_string, { allowDangerousHtml: true })

    const mdast = pipeline.parse(raw) // this only calls the mdast parsing
    console.log('raw text -> mdast', mdast)

    const sanitized = hide_markdown_ranges(mdast, raw)
    console.log('sanitized text', sanitized)

    const output = hide_svelte_ranges(sanitized, raw, mdast)
    // console.log(output)

    // const text = pipeline.processSync(output.text)
    // console.log(text.toString())
  }
