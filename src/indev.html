<script type="module">
  import string_to_mdast from 'https://esm.sh/remark-parse'
  import mdast_to_hast from 'https://esm.sh/remark-rehype'
  import hast_to_string from 'https://esm.sh/rehype-stringify'
  import { unified } from 'https://esm.sh/unified'
  import { inspect } from 'https://esm.sh/unist-util-inspect'
  import { CONTINUE, EXIT, SKIP, visit } from 'https://esm.sh/unist-util-visit'
  import { parse as svparse } from 'https://esm.sh/svelte@5.56.3/compiler'
  import { walk } from 'https://esm.sh/zimmerframe@1.1.4'

  // Step 1: Blank out ranges before Svelte parse.
  // (Svelte can't parse code blocks, inline code, custom nodes, etc.)
  function blankMarkdownProtectedRanges(mdast, text) {
    const ranges = []

    const SVELTE_SAFE_NODE_TYPES = new Set([
      'root',
      'paragraph',
      'heading',
      'blockquote',
      'list',
      'listItem',
      'emphasis',
      'strong',
      'delete', // strikethrough
      'link',
      'text',
      'break',
      'thematicBreak',
      // html nodes are already raw, Svelte handles them fine
      'html',
    ])

    visit(mdast, (node) => {
      console.log(node.type)
      if (!SVELTE_SAFE_NODE_TYPES.has(node.type)) {
        ranges.push({
          start: node.position.start.offset,
          end: node.position.end.offset,
        })
        return SKIP
      }
    })

    // Todo: improve and test performance. This just replaces the ranges with spaces.
    const chars = text.split('')
    for (const { start, end } of ranges) {
      for (let i = start; i < end; i++) {
        if (chars[i] != '\n') chars[i] = ' '
      }
    }
    return chars.join('')
  }

  // Step 2: Parse svelte (which works now) and find Svelte-specific ranges.
  // such as {#each}, {@attach}, <button onclick={()=>{}}>
  // @todo add handling if svparse fails
  function findSvelteRanges(text) {
    const svast = svparse(text, { modern: true })
    console.log(svast)

    console.log('markdown ranges:')
    const markdownTextRanges = []
    walk(
      svast,
      {},
      {
        Text(node, { path }) {
          // raw vs data: data has html entities converted to actual unicode
          // return if string is just empty whitespace.
          if (node.raw.trim().length == 0) return

          const parent = path.at(-1)

          // console.log(parent)
          // Not 100% sure if this is accurate enough. Avoids attribute for example
          if (parent.type != 'Fragment') return

          console.log(parent, node)
          markdownTextRanges.push({ start: node.start, end: node.end }) // potentially just push node
        },
      },
    )
  }

  // Step 3: Reconcile svelte ranges into the mdast.
  function reconcileMdastAndSvelte(mdast, svelteRanges, text) {}

  async function parse(text, config) {
    const parse = unified().use(string_to_mdast)
    const mdast = parse.parse(text)
    console.log(mdast)

    const sanitized = blankMarkdownProtectedRanges(mdast, text)
    console.log(sanitized)

    const svelteRanges = findSvelteRanges(sanitized)
    console.log(svelteRanges)

    // const final_mdast = reconcileMdastAndSvelte(mdast, svelteRanges, text)
    // console.log(final_mdast)
